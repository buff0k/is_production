{% extends "templates/web.html" %}

{% block page_content %}
<link rel="stylesheet" href="/assets/is_production/css/dashboards.css">
<style>
html,
body {
    background: #ffffff !important;
    overflow: hidden !important;
}

header,
footer,
.web-footer,
.navbar,
.page-breadcrumbs,
.page-header,
.page-footer,
.footer-powered {
    display: none !important;
}

.web-page,
.page_content,
.page-content,
.page-content-wrapper,
main,
.container,
.container-fluid {
    max-width: none !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
}

#portal-site-volume-graphs-app {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #ffffff;
    overflow: auto;
    padding: 12px;
    box-sizing: border-box;
}

.portal-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    padding: 0 2px;
}

.portal-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    line-height: 32px;
    color: var(--isd-dashboard-text, #1f272e);
    white-space: nowrap;
}

.portal-filter {
    width: 320px;
    position: relative;
}

.portal-filter input {
    width: 100%;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--isd-dashboard-border, #d1d8dd);
    padding: 4px 10px;
    background: var(--isd-dashboard-muted-bg, #f7fafc);
    color: var(--isd-dashboard-text, #1f272e);
    font-size: 14px;
    outline: none;
}

.portal-filter input:focus {
    border-color: #9aa8b5;
    background: #ffffff;
}

.portal-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 10000;
    background: #ffffff;
    border: 1px solid var(--isd-dashboard-border, #d1d8dd);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    max-height: 260px;
    overflow-y: auto;
    display: none;
}

.portal-option {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #f3f3f3;
    font-size: 13px;
}

.portal-option:hover {
    background: var(--isd-dashboard-muted-bg, #f7fafc);
}

.portal-empty {
    padding: 10px 12px;
    color: var(--isd-dashboard-muted-text, #6b7280);
    font-size: 13px;
}

#dashboard_status {
    margin: 0 0 10px 0;
    padding: 0 2px;
    color: var(--isd-dashboard-muted-text, #6b7280);
    font-size: 14px;
}

#dashboard_content {
    width: 100%;
}

.text-muted {
    color: var(--isd-dashboard-muted-text, #6b7280);
}

.text-danger {
    color: var(--isd-dashboard-red, #e24c4c);
}

@media (max-width: 700px) {
    #portal-site-volume-graphs-app {
        padding: 6px;
    }

    .portal-topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }

    .portal-filter {
        width: 100%;
    }
}
</style>

<div id="portal-site-volume-graphs-app">
    <div class="portal-topbar">
        <h1 class="portal-title">Site Volume Graphs</h1>

        <div class="portal-filter">
            <input
                type="text"
                id="define_monthly_production"
                placeholder="Search Define Monthly Production"
                autocomplete="off"
            >
            <div id="define_monthly_production_dropdown" class="portal-dropdown"></div>
        </div>
    </div>

    <div id="dashboard_status">Select a Define Monthly Production to load the graphs.</div>
    <div id="dashboard_content" class="isd-dashboard isd-dashboard--ceo-graphs">
        <div id="dashboard_grid" class="isd-dashboard-grid"></div>
    </div>
</div>

<script>
{% raw %}
(function () {
    const REFRESH_INTERVAL_MS = 10 * 60 * 1000;
    const HARD_RELOAD_INTERVAL_MS = 4 * 60 * 60 * 1000;
    const STORAGE_KEY = "site_volume_graphs_define_monthly_production";

    const TARGET_LINE_COLOR = "#9E9E9E";
    const ACTUAL_ABOVE_TARGET_COLOR = "#2fb344";
    const ACTUAL_BELOW_TARGET_COLOR = "#e24c4c";
    const CURRENT_DATE_POINT_COLOR = "#2fb344";
    const PROJECTED_LINE_COLOR = "#1f77b4";

    const TARGET_POINT_RADIUS = 3;
    const ACTUAL_POINT_RADIUS = 3;
    const CURRENT_DATE_POINT_RADIUS = 3.75;

    const DEFAULT_Y_AXIS_STEP = 10000;

    const input = document.getElementById("define_monthly_production");
    const dropdown = document.getElementById("define_monthly_production_dropdown");
    const statusEl = document.getElementById("dashboard_status");
    const dashEl = document.getElementById("dashboard_grid");

    let _charts = [];
    let _refreshing = false;
    let _timer = null;
    let _last_successful_refresh = null;

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function normaliseInt(value) {
        const parsed = parseInt(value, 10);
        return Number.isFinite(parsed) ? parsed : 0;
    }

    function normaliseFloat(value) {
        const parsed = parseFloat(value);
        return Number.isFinite(parsed) ? parsed : 0;
    }

    function parseJsonArray(value) {
        if (Array.isArray(value)) {
            return value;
        }

        if (value == null || value === "") {
            return [];
        }

        try {
            const parsed = JSON.parse(value);
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    function extractRowsFromPayload(payload) {
        if (!payload) {
            return [];
        }

        if (Array.isArray(payload.result)) {
            return payload.result;
        }

        if (Array.isArray(payload.data)) {
            return payload.data;
        }

        if (Array.isArray(payload)) {
            return payload;
        }

        return [];
    }

    function getCurrentActualIndex(actualData) {
        if (!Array.isArray(actualData)) {
            return -1;
        }

        for (let i = actualData.length - 1; i >= 0; i--) {
            const value = actualData[i];

            if (value !== null && value !== undefined && value !== "") {
                const numericValue = Number(value);

                if (Number.isFinite(numericValue)) {
                    return i;
                }
            }
        }

        return -1;
    }

    function getYAxisStep(rows) {
        if (!Array.isArray(rows) || !rows.length) {
            return DEFAULT_Y_AXIS_STEP;
        }

        for (const row of rows) {
            const step = normaliseInt(row.y_axis_step);

            if (step > 0) {
                return step;
            }
        }

        return DEFAULT_Y_AXIS_STEP;
    }

    function getMaxNumericValue(values) {
        if (!Array.isArray(values)) {
            return 0;
        }

        let maxValue = 0;

        values.forEach(function (value) {
            if (value === null || value === undefined || value === "") {
                return;
            }

            const numericValue = Number(value);

            if (Number.isFinite(numericValue) && numericValue > maxValue) {
                maxValue = numericValue;
            }
        });

        return maxValue;
    }

    function computeSharedYAxisMax(rows) {
        const yAxisStep = getYAxisStep(rows);
        let maxValue = 0;

        rows.forEach(function (row) {
            const targetData = parseJsonArray(row.mtd_target_data);
            const actualData = parseJsonArray(row.mtd_actual_data);
            const projectedData = parseJsonArray(row.projected_mtd_data);

            maxValue = Math.max(
                maxValue,
                getMaxNumericValue(targetData),
                getMaxNumericValue(actualData),
                getMaxNumericValue(projectedData),
                normaliseFloat(row.monthly_target_bcm),
                normaliseFloat(row.projected_month_end_bcm)
            );
        });

        if (!maxValue || maxValue <= 0) {
            return yAxisStep;
        }

        return Math.ceil(maxValue / yAxisStep) * yAxisStep;
    }

    function buildChartConfig(labels, targetData, actualData, projectedData, sharedYAxisMax, yAxisStep) {
        const currentActualIndex = getCurrentActualIndex(actualData);

        function actualPointColour(index) {
            const actual = Number(actualData[index]);
            const target = Number(targetData[index]);

            if (!Number.isFinite(actual)) {
                return ACTUAL_BELOW_TARGET_COLOR;
            }

            if (!Number.isFinite(target)) {
                return ACTUAL_ABOVE_TARGET_COLOR;
            }

            return actual >= target
                ? ACTUAL_ABOVE_TARGET_COLOR
                : ACTUAL_BELOW_TARGET_COLOR;
        }

        function actualSegmentColour(ctx) {
            const index = ctx.p1DataIndex;

            if (index == null) {
                return ACTUAL_BELOW_TARGET_COLOR;
            }

            return actualPointColour(index);
        }

        return {
            type: "line",
            data: {
                labels: labels,
                datasets: [
                    {
                        label: "MTD Target",
                        data: targetData,
                        borderColor: TARGET_LINE_COLOR,
                        backgroundColor: TARGET_LINE_COLOR,
                        pointBackgroundColor: TARGET_LINE_COLOR,
                        pointBorderColor: TARGET_LINE_COLOR,
                        borderWidth: 2,
                        tension: 0.25,
                        pointRadius: TARGET_POINT_RADIUS,
                        pointHoverRadius: TARGET_POINT_RADIUS + 2,
                        pointBorderWidth: 1
                    },
                    {
                        label: "MTD Actual",
                        data: actualData,
                        borderColor: ACTUAL_BELOW_TARGET_COLOR,
                        segment: {
                            borderColor: actualSegmentColour
                        },
                        backgroundColor: function (ctx) {
                            return actualPointColour(ctx.dataIndex);
                        },
                        pointBackgroundColor: function (ctx) {
                            if (ctx.dataIndex === currentActualIndex) {
                                return CURRENT_DATE_POINT_COLOR;
                            }

                            return actualPointColour(ctx.dataIndex);
                        },
                        pointBorderColor: function (ctx) {
                            if (ctx.dataIndex === currentActualIndex) {
                                return CURRENT_DATE_POINT_COLOR;
                            }

                            return actualPointColour(ctx.dataIndex);
                        },
                        pointRadius: function (ctx) {
                            return ctx.dataIndex === currentActualIndex
                                ? CURRENT_DATE_POINT_RADIUS
                                : ACTUAL_POINT_RADIUS;
                        },
                        pointHoverRadius: function (ctx) {
                            return ctx.dataIndex === currentActualIndex
                                ? CURRENT_DATE_POINT_RADIUS + 2
                                : ACTUAL_POINT_RADIUS + 2;
                        },
                        borderWidth: 2,
                        tension: 0.25,
                        pointBorderWidth: 1,
                        spanGaps: false
                    },
                    {
                        label: "Projected MTD",
                        data: projectedData,
                        borderColor: PROJECTED_LINE_COLOR,
                        backgroundColor: PROJECTED_LINE_COLOR,
                        pointBackgroundColor: PROJECTED_LINE_COLOR,
                        pointBorderColor: PROJECTED_LINE_COLOR,
                        borderWidth: 2,
                        borderDash: [6, 4],
                        tension: 0.25,
                        pointRadius: 0,
                        pointHoverRadius: 3,
                        pointBorderWidth: 1,
                        spanGaps: false
                    }
                ]
            },
            options: {
                animation: false,
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        left: 32,
                        right: 12,
                        top: 10,
                        bottom: 10
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            autoSkip: true,
                            font: {
                                size: 11
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: sharedYAxisMax,
                        ticks: {
                            stepSize: yAxisStep,
                            font: {
                                size: 11
                            },
                            padding: 6
                        }
                    }
                }
            }
        };
    }

    function ensureChartJs() {
        if (window.Chart) {
            return Promise.resolve();
        }

        if (window._isd_chartjs_promise) {
            return window._isd_chartjs_promise;
        }

        window._isd_chartjs_promise = new Promise(function (resolve, reject) {
            const existing = document.querySelector('script[data-isd-chartjs="1"]');

            if (existing) {
                existing.addEventListener("load", function () { resolve(); }, { once: true });
                existing.addEventListener("error", function () { reject(new Error("Chart.js failed to load")); }, { once: true });
                return;
            }

            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/chart.js";
            script.dataset.isdChartjs = "1";
            script.onload = function () { resolve(); };
            script.onerror = function () { reject(new Error("Chart.js failed to load")); };
            document.head.appendChild(script);
        });

        return window._isd_chartjs_promise;
    }

    function destroyCharts() {
        _charts.forEach(function (chart) {
            try {
                chart.destroy();
            } catch (e) {
                // ignore stale chart instances
            }
        });

        _charts = [];
    }

    function renderCharts(chartConfigs) {
        if (!window.Chart) {
            return;
        }

        destroyCharts();

        dashEl.querySelectorAll("canvas[data-chart-index]").forEach(function (canvas) {
            const idx = parseInt(canvas.dataset.chartIndex, 10);
            const config = chartConfigs[idx];

            if (!config) {
                return;
            }

            try {
                const chart = new Chart(canvas.getContext("2d"), config);
                _charts.push(chart);

                setTimeout(function () { chart.resize(); }, 50);
                setTimeout(function () { chart.resize(); }, 150);
            } catch (e) {
                console.error("Could not render site volume chart", e);
            }
        });
    }

    function getHeaderBackgroundStyle(site, siteColourMap) {
        const mappedColour = siteColourMap && siteColourMap[site]
            ? String(siteColourMap[site]).trim()
            : "";

        if (!mappedColour) {
            return "background:transparent;";
        }

        return "background:" + escapeHtml(mappedColour) + ";";
    }

    function buildSiteCard(row, siteColourMap, idx) {
        const site = String(row.site || "").trim();
        const prodStart = row.prod_start || "";
        const prodEnd = row.prod_end || "";
        const mtdUpto = row.mtd_upto || "";
        const headerBackground = getHeaderBackgroundStyle(site, siteColourMap);

        return (
            '<div class="isd-dashboard-card">' +
                '<div class="isd-dashboard-card-header" style="' + headerBackground + '">' +
                    '<div class="isd-dashboard-card-title">Site: ' + escapeHtml(site) + "</div>" +
                    '<div class="isd-dashboard-card-subtitle">' +
                        "Production Period: " + escapeHtml(prodStart) + " → " + escapeHtml(prodEnd) + "<br>" +
                        "MTD up to: " + escapeHtml(mtdUpto) + "<br>" +
                        "Projection: blue dashed line" +
                    "</div>" +
                "</div>" +

                '<div class="isd-dashboard-chart">' +
                    '<canvas data-chart-index="' + idx + '"></canvas>' +
                "</div>" +
            "</div>"
        );
    }

    function sortRows(rows, siteOrderMap) {
        return rows.slice().sort(function (a, b) {
            const aSite = String(a.site || "").trim();
            const bSite = String(b.site || "").trim();

            const aFallbackOrder = Object.prototype.hasOwnProperty.call(siteOrderMap, aSite)
                ? siteOrderMap[aSite]
                : 999999;

            const bFallbackOrder = Object.prototype.hasOwnProperty.call(siteOrderMap, bSite)
                ? siteOrderMap[bSite]
                : 999999;

            const aOrder = normaliseInt(a.site_order || aFallbackOrder);
            const bOrder = normaliseInt(b.site_order || bFallbackOrder);

            if (aOrder !== bOrder) {
                return aOrder - bOrder;
            }

            return aSite.localeCompare(bSite);
        });
    }

    function renderDashboard(response) {
        const payload = response && response.payload ? response.payload : {};
        const siteOrderMap = response && response.site_order_map ? response.site_order_map : {};
        const siteColourMap = response && response.site_colour_map ? response.site_colour_map : {};
        const rows = extractRowsFromPayload(payload);

        destroyCharts();

        if (!rows.length) {
            dashEl.innerHTML = '<div class="text-muted">No graph data for the selected filter.</div>';
            return;
        }

        const sorted = sortRows(rows, siteOrderMap);
        const yAxisStep = getYAxisStep(sorted);
        const sharedYAxisMax = computeSharedYAxisMax(sorted);

        const chartConfigs = sorted.map(function (row) {
            const labels = parseJsonArray(row.chart_labels);
            const targetData = parseJsonArray(row.mtd_target_data);
            const actualData = parseJsonArray(row.mtd_actual_data);
            const projectedData = parseJsonArray(row.projected_mtd_data);

            return buildChartConfig(
                labels,
                targetData,
                actualData,
                projectedData,
                sharedYAxisMax,
                yAxisStep
            );
        });

        dashEl.innerHTML = sorted.map(function (row, idx) {
            return buildSiteCard(row, siteColourMap, idx);
        }).join("");

        renderCharts(chartConfigs);
    }



    function to_native_promise(value) {
        return new Promise(function (resolve, reject) {
            if (!value || typeof value.then !== "function") {
                resolve(value);
                return;
            }

            if (typeof value.done === "function" && typeof value.fail === "function") {
                value.done(resolve);
                value.fail(reject);
                return;
            }

            value.then(resolve, reject);
        });
    }

    function get_csrf_token() {
        const fromFrappe = window.frappe && window.frappe.csrf_token;
        const fromWindow = window.csrf_token;
        const fromMeta = document.querySelector('meta[name="csrf-token"]');

        return fromFrappe || fromWindow || (fromMeta ? fromMeta.content : "") || "";
    }

    function normalise_frappe_response(data) {
        if (!data) {
            return {};
        }

        return data;
    }

    function call_method(method, args) {
        args = args || {};

        if (window.frappe && typeof window.frappe.call === "function") {
            return to_native_promise(window.frappe.call({
                method: method,
                args: args,
                freeze: false
            })).then(normalise_frappe_response);
        }

        const query = new URLSearchParams();

        Object.keys(args).forEach(function (key) {
            if (args[key] !== undefined && args[key] !== null) {
                query.append(key, String(args[key]));
            }
        });

        const url = "/api/method/" + method + (query.toString() ? "?" + query.toString() : "");

        return fetch(url, {
            method: "GET",
            credentials: "same-origin",
            headers: {
                "Accept": "application/json"
            }
        })
            .then(function (response) {
                return response.text().then(function (text) {
                    let data = {};

                    if (text) {
                        try {
                            data = JSON.parse(text);
                        } catch (e) {
                            data = { message: text };
                        }
                    }

                    if (!response.ok) {
                        const err = new Error(
                            data.exc_type || data.exception || data.exc || response.statusText || "Request failed"
                        );
                        err.status = response.status;
                        err.response = data;
                        throw err;
                    }

                    return normalise_frappe_response(data);
                });
            });
    }

    // ---------------------------------------------------------
    // DESK-ALIGNED REFRESH SCHEDULER
    //
    // Refresh exactly at:
    //   HH:10
    //   HH:30
    //
    // Example:
    //   09:10
    //   09:30
    //   10:10
    //   10:30
    // ---------------------------------------------------------
    function ms_until_next_refresh() {
        const now = new Date();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ms = now.getMilliseconds();

        let nextMinute;

        if (minutes < 10) {
            nextMinute = 10;
        } else if (minutes < 30) {
            nextMinute = 30;
        } else {
            // 70 means next hour at minute 10.
            nextMinute = 70;
        }

        return (
            (nextMinute - minutes) * 60 * 1000 -
            seconds * 1000 -
            ms
        );
    }

    function clear_existing_timer() {
        if (_timer) {
            clearTimeout(_timer);
            _timer = null;
        }
    }

    function start_auto_refresh() {
        stop_auto_refresh();

        function schedule_next() {
            clear_existing_timer();

            _timer = setTimeout(function () {
                if (!String(input.value || "").trim()) {
                    schedule_next();
                    return;
                }

                safe_refresh(true)
                    .finally(function () {
                        schedule_next();
                    });

            }, ms_until_next_refresh());
        }

        schedule_next();
    }

    function stop_auto_refresh() {
        clear_existing_timer();
        _refreshing = false;
    }

    function format_last_successful_refresh() {
        if (!_last_successful_refresh) {
            return "never";
        }

        return _last_successful_refresh.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function safe_refresh(is_auto) {
        if (_refreshing) {
            return Promise.resolve();
        }

        if (!String(input.value || "").trim()) {
            return Promise.resolve();
        }

        _refreshing = true;

        return to_native_promise(load_and_render(is_auto))
            .then(function () {
                _last_successful_refresh = new Date();
                _refreshing = false;
            }, function (e) {
                console.error("Dashboard refresh failed:", e);
                statusEl.textContent = "Refresh failed. Last successful update: " + format_last_successful_refresh();
                _refreshing = false;
            });
    }

    function refresh_when_visible_again() {
        if (!document.hidden && String(input.value || "").trim()) {
            safe_refresh(true);
        }
    }

    function hard_reload_page() {
        window.location.reload();
    }

    function run_report(value) {
        return call_method("is_production.templates.pages.portal_site_volume_graphs.run_portal_report", {
            define_monthly_production: value
        });
    }

    function load_and_render(is_auto) {
        const val = input.value;

        if (!val) {
            localStorage.removeItem(STORAGE_KEY);
            stop_auto_refresh();
            destroyCharts();
            statusEl.textContent = "Select a Define Monthly Production to load the graphs.";
            dashEl.innerHTML = "";
            return Promise.resolve();
        }

        localStorage.setItem(STORAGE_KEY, val);
        statusEl.textContent = is_auto ? "Refreshing..." : "Loading...";

        return Promise.all([
            ensureChartJs(),
            run_report(val)
        ])
            .then(function (results) {
                const response = results[1];

                renderDashboard(response.message || {});

                const time = new Date().toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                statusEl.textContent = "Last updated: " + time + " (refreshes at :10 and :30)";
            })
            .catch(function (e) {
                console.error("Site Volume Graphs portal error:", e);
                statusEl.textContent = "Error loading Site Volume Graphs.";
                dashEl.innerHTML = '<div class="text-danger">Could not load graphs. Check console / server logs.</div>';
                throw e;
            });
    }

    async function search_define_monthly_production(term) {
        const r = await call_method("is_production.templates.pages.portal_site_volume_graphs.search_define_monthly_production", {
            txt: term || ""
        });

        return r.message || [];
    }

    async function render_dropdown() {
        const term = input.value || "";

        try {
            const results = await search_define_monthly_production(term);

            if (!results.length) {
                dropdown.innerHTML = '<div class="portal-empty">No matches found</div>';
                dropdown.style.display = "block";
                return;
            }

            dropdown.innerHTML = results.map(function (option) {
                return (
                    '<div class="portal-option" data-value="' + escapeHtml(option) + '">' +
                        escapeHtml(option) +
                    '</div>'
                );
            }).join("");

            dropdown.style.display = "block";
        } catch (e) {
            console.error("Search failed:", e);
            dropdown.innerHTML = '<div class="portal-empty">No matches found</div>';
            dropdown.style.display = "block";
        }
    }

    input.addEventListener("focus", render_dropdown);
    input.addEventListener("input", render_dropdown);

    dropdown.addEventListener("mousedown", function (e) {
        const optionEl = e.target.closest(".portal-option");

        if (!optionEl) {
            return;
        }

        input.value = optionEl.getAttribute("data-value");
        dropdown.style.display = "none";

        localStorage.setItem(STORAGE_KEY, input.value);
        safe_refresh(false);
        start_auto_refresh();
    });

    input.addEventListener("change", function () {
        if (!input.value) {
            safe_refresh(false);
        }
    });

    document.addEventListener("click", function (e) {
        const wrap = input.closest(".portal-filter");

        if (wrap && !wrap.contains(e.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("visibilitychange", refresh_when_visible_again);
    window.addEventListener("focus", refresh_when_visible_again);
    window.addEventListener("online", refresh_when_visible_again);

    window.setTimeout(hard_reload_page, HARD_RELOAD_INTERVAL_MS);

    // ---------------------------------------------------------
    // AUTO DEFAULT CURRENT MONTH - PORTAL
    //
    // Every time this page opens:
    //   September 2026 -> September-2026-Hourly-Hourly
    //   October 2026   -> October-2026-Hourly-Hourly
    //
    // User can still manually select another month afterwards.
    // ---------------------------------------------------------
    async function initialise_current_month_default() {
        try {
            const parts = new Intl.DateTimeFormat("en-US", {
                month: "long",
                year: "numeric",
                timeZone: "Africa/Johannesburg"
            }).formatToParts(new Date());

            const monthPart = parts.find(function (part) {
                return part.type === "month";
            });

            const yearPart = parts.find(function (part) {
                return part.type === "year";
            });

            const month = monthPart ? monthPart.value : "";
            const year = yearPart ? yearPart.value : "";

            if (!month || !year) {
                statusEl.textContent =
                    "Could not determine the current production month.";
                return;
            }

            const exactName = month + "-" + year + "-Hourly-Hourly";
            const monthPrefix = month + "-" + year + "-";

            console.log(
                "Site Volume Graphs portal: looking for current month:",
                exactName
            );

            // First search for the exact preferred record.
            let results = await search_define_monthly_production(exactName);

            let selectedName = (results || []).find(function (name) {
                return String(name || "").trim() === exactName;
            }) || "";

            // If exact search did not return it, search all records
            // for the current month and prefer Hourly-Hourly.
            if (!selectedName) {
                results = await search_define_monthly_production(monthPrefix);

                selectedName = (results || []).find(function (name) {
                    const value = String(name || "").trim();

                    return (
                        value.indexOf(monthPrefix) === 0 &&
                        /-Hourly-Hourly$/i.test(value)
                    );
                }) || "";
            }

            if (!selectedName) {
                console.warn(
                    "Site Volume Graphs portal: current month not found. Falling back to latest existing Hourly-Hourly record."
                );

                const latestResponse = await call_method("frappe.client.get_list", {
                    doctype: "Define Monthly Production",
                    fields: ["name"],
                    filters: [
                        ["name", "like", "%-Hourly-Hourly"]
                    ],
                    order_by: "creation desc",
                    limit_page_length: 20
                });

                const latestRows = (latestResponse && latestResponse.message) || [];

                selectedName = latestRows
                    .map(function (row) {
                        return row && row.name ? String(row.name).trim() : "";
                    })
                    .filter(Boolean)
                    .find(function (name) {
                        return /-Hourly-Hourly$/i.test(name);
                    }) || "";
            }

            if (!selectedName) {
                localStorage.removeItem(STORAGE_KEY);
                input.value = "";

                stop_auto_refresh();
                destroyCharts();
                dashEl.innerHTML = "";

                statusEl.textContent =
                    "No Hourly-Hourly Define Monthly Production records were found. Please select another month.";

                console.warn(
                    "Site Volume Graphs portal: no Hourly-Hourly Define Monthly Production records found."
                );

                return;
            }

            // Current month always becomes the page-opening default.
            input.value = selectedName;
            localStorage.setItem(STORAGE_KEY, selectedName);

            console.log(
                "Site Volume Graphs portal: selected default:",
                selectedName
            );

            await safe_refresh(false);
            start_auto_refresh();

        } catch (e) {
            console.error(
                "Could not auto-select current Define Monthly Production:",
                e
            );

            statusEl.textContent =
                "Could not automatically select the current month. " +
                "Please select a Define Monthly Production.";
        }
    }

    // Do not allow an old manually selected month to become
    // the default the next time the portal page opens.
    localStorage.removeItem(STORAGE_KEY);

    initialise_current_month_default();

    window.addEventListener("beforeunload", function () {
        stop_auto_refresh();
    });
})();

</script>

{% extends "templates/web.html" %}

{% block page_content %}
<link rel="stylesheet" href="/assets/is_production/css/dashboards.css">
<style>
html,
body {
    background: #ffffff !important;
    overflow: hidden !important;
}

header,
footer,
.web-footer,
.navbar,
.page-breadcrumbs,
.page-header,
.page-footer,
.footer-powered {
    display: none !important;
}

.web-page,
.page_content,
.page-content,
.page-content-wrapper,
main,
.container,
.container-fluid {
    max-width: none !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
}

#portal-site-volume-tracking-app {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #ffffff;
    overflow: auto;
    padding: 4px;
    box-sizing: border-box;
}

.portal-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    padding: 0 4px;
}

.portal-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    line-height: 32px;
    color: var(--isd-dashboard-text, #1f272e);
    white-space: nowrap;
}

.portal-filter {
    width: 320px;
    position: relative;
}

.portal-filter input {
    width: 100%;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--isd-dashboard-border, #d1d8dd);
    padding: 4px 10px;
    background: var(--isd-dashboard-muted-bg, #f7fafc);
    color: var(--isd-dashboard-text, #1f272e);
    font-size: 14px;
    outline: none;
}

.portal-filter input:focus {
    border-color: #9aa8b5;
    background: #ffffff;
}

.portal-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 10000;
    background: #ffffff;
    border: 1px solid var(--isd-dashboard-border, #d1d8dd);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    max-height: 260px;
    overflow-y: auto;
    display: none;
}

.portal-option {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #f3f3f3;
    font-size: 13px;
}

.portal-option:hover {
    background: var(--isd-dashboard-muted-bg, #f7fafc);
}

.portal-empty {
    padding: 10px 12px;
    color: var(--isd-dashboard-muted-text, #6b7280);
    font-size: 13px;
}

#dashboard_status {
    margin: 0 0 8px 0;
    padding: 0 4px;
    color: var(--isd-dashboard-muted-text, #6b7280);
    font-size: 14px;
}

#dashboard_content {
    width: 100%;
}

.text-muted {
    color: var(--isd-dashboard-muted-text, #6b7280);
}

.text-danger {
    color: var(--isd-dashboard-red, #e24c4c);
}

@media (max-width: 800px) {
    .portal-topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }

    .portal-filter {
        width: 100%;
    }
}
</style>

<div id="portal-site-volume-tracking-app">
    <div class="portal-topbar">
        <h1 class="portal-title">Site Volume Tracking</h1>

        <div class="portal-filter">
            <input
                type="text"
                id="define_monthly_production"
                placeholder="Search Define Monthly Production"
                autocomplete="off"
            >
            <div id="define_monthly_production_dropdown" class="portal-dropdown"></div>
        </div>
    </div>

    <div id="dashboard_status">Select a Define Monthly Production to load the dashboard.</div>
    <div id="dashboard_content" class="isd-dashboard isd-dashboard--ceo-volume">
        <div id="dashboard_grid" class="isd-dashboard-grid"></div>
    </div>
</div>

<script>
(function () {
    "use strict";

    const REFRESH_INTERVAL_MS = 10 * 60 * 1000;
    const HARD_RELOAD_INTERVAL_MS = 4 * 60 * 60 * 1000;
    const STORAGE_KEY = "ceo_dash_define_monthly_production";

    const input = document.getElementById("define_monthly_production");
    const dropdown = document.getElementById("define_monthly_production_dropdown");
    const statusEl = document.getElementById("dashboard_status");
    const dashEl = document.getElementById("dashboard_grid");

    let _refreshing = false;
    let _timer = null;
    let _last_successful_refresh = null;

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function fmtInt(n) {
        const x = Number(n || 0);
        return Math.round(x).toLocaleString();
    }

    function fmtDecimal(n, decimals) {
        decimals = decimals == null ? 1 : decimals;
        const x = Number(n || 0);

        return x.toLocaleString(undefined, {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }

    function goodBadClassFromValue(val) {
        const v = Number(val || 0);
        return v >= 0 ? "isd-dashboard-good" : "isd-dashboard-bad";
    }

    function arrowUpDown(val) {
        const v = Number(val || 0);
        return v >= 0 ? "▲" : "▼";
    }

    function varianceClass(value) {
        return Number(value || 0) >= 0
            ? "isd-dashboard-var-good"
            : "isd-dashboard-var-bad";
    }

    function getHeaderBackgroundStyle(site, siteColourMap) {
        const mappedColour = siteColourMap && siteColourMap[site]
            ? String(siteColourMap[site]).trim()
            : "";

        if (!mappedColour) {
            return "background:transparent;";
        }

        return "background:" + escapeHtml(mappedColour) + ";";
    }

    function formatDateForUser(value) {
        if (!value) {
            return "";
        }

        if (frappe.datetime && frappe.datetime.str_to_user) {
            return frappe.datetime.str_to_user(value);
        }

        return value;
    }

    function kpiBox(label, value, opts) {
        opts = opts || {};

        const coloured = !!opts.coloured;
        const showArrow = !!opts.showArrow;
        const sublabel = opts.sublabel || "";
        const formatter = typeof opts.formatter === "function" ? opts.formatter : fmtInt;

        let classes = "isd-dashboard-kpi";
        let arrow = "";
        let inlineStyle = "";

        if (opts.customBackground) {
            inlineStyle += "background:" + opts.customBackground + ";";
        }

        if (opts.customTextColor) {
            inlineStyle += "color:" + opts.customTextColor + ";";
        }

        if (coloured) {
            classes += " " + goodBadClassFromValue(value);

            if (showArrow) {
                arrow = arrowUpDown(value);
            }
        }

        return (
            '<div class="' + classes + '" style="' + inlineStyle + '">' +
                '<div class="isd-dashboard-kpi-label">' + escapeHtml(label) + '</div>' +
                (
                    sublabel
                        ? '<div class="isd-dashboard-kpi-sub-label">' + escapeHtml(sublabel) + '</div>'
                        : '<div class="isd-dashboard-kpi-sub-label">&nbsp;</div>'
                ) +
                '<div class="isd-dashboard-kpi-value">' +
                    '<span class="isd-dashboard-kpi-trend">' +
                        (arrow ? '<span class="isd-dashboard-kpi-arrow">' + arrow + '</span>' : '') +
                        '<span>' + formatter(value) + '</span>' +
                    '</span>' +
                '</div>' +
            '</div>'
        );
    }

    function kpiRequiredVsOriginal(label, required, original) {
        const req = Number(required || 0);
        const orig = Number(original || 0);

        const good = req <= orig;
        const cls = good ? "isd-dashboard-good" : "isd-dashboard-bad";
        const arrow = good ? "▲" : "▼";

        return (
            '<div class="isd-dashboard-kpi ' + cls + '">' +
                '<div class="isd-dashboard-kpi-label">' + escapeHtml(label) + '</div>' +
                '<div class="isd-dashboard-kpi-sub-label">&nbsp;</div>' +
                '<div class="isd-dashboard-kpi-value">' +
                    '<span class="isd-dashboard-kpi-trend">' +
                        '<span class="isd-dashboard-kpi-arrow">' + arrow + '</span>' +
                        '<span>' + fmtInt(req) + '</span>' +
                    '</span>' +
                '</div>' +
            '</div>'
        );
    }

    function th(text, sepClass) {
        sepClass = sepClass || "";

        const classes = ["isd-dashboard-th"];

        if (sepClass) {
            classes.push(sepClass);
        }

        return (
            '<th class="' + classes.join(" ") + '">' +
                '<span class="isd-dashboard-cell-inner">' + escapeHtml(text) + '</span>' +
            '</th>'
        );
    }

    function td(value, opts) {
        opts = opts || {};

        const classes = ["isd-dashboard-td"];
        const innerClasses = ["isd-dashboard-cell-inner"];

        if (opts.sepClass) {
            classes.push(opts.sepClass);
        }

        if (opts.varClass) {
            innerClasses.push(opts.varClass);
        }

        return (
            '<td class="' + classes.join(" ") + '">' +
                '<span class="' + innerClasses.join(" ") + '">' + fmtInt(value) + '</span>' +
            '</td>'
        );
    }

    function buildSummaryTable(r) {
        const mtdVar = Number(r.mtd_var_bcm || 0);
        const coalVar = Number(r.mtd_coal_var_t || 0);
        const wasteVar = Number(r.mtd_waste_var_bcm || 0);
        const dayVar = Number(r.day_var_bcm || 0);

        return (
            '<table class="isd-dashboard-table isd-dashboard-table--summary">' +
                '<tr>' +
                    th("Month Target(bcm)", "isd-dashboard-subsep") +
                    th("Month Coal(t)", "isd-dashboard-subsep") +
                    th("Month Waste(bcm)", "isd-dashboard-sep") +

                    th("MTD Act(bcm)", "isd-dashboard-subsep") +
                    th("MTD Plan(bcm)", "isd-dashboard-subsep") +
                    th("Var", "isd-dashboard-sep") +

                    th("MTD C (t)", "isd-dashboard-subsep") +
                    th("MTD C Plan(t)", "isd-dashboard-subsep") +
                    th("Var C", "isd-dashboard-sep") +

                    th("MTD W (bcm)", "isd-dashboard-subsep") +
                    th("MTD W Plan(bcm)", "isd-dashboard-subsep") +
                    th("Var W", "isd-dashboard-sep") +

                    th("Day BCM", "isd-dashboard-subsep") +
                    th("Day Target(bcm)", "isd-dashboard-subsep") +
                    th("Day Var", "isd-dashboard-sep") +
                '</tr>' +
                '<tr>' +
                    td(r.month_target_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.month_coal_t, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.month_waste_bcm, { sepClass: "isd-dashboard-sep" }) +

                    td(r.mtd_act_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.mtd_plan_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.mtd_var_bcm, {
                        sepClass: "isd-dashboard-sep",
                        varClass: varianceClass(mtdVar)
                    }) +

                    td(r.mtd_coal_t, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.mtd_coal_plan_t, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.mtd_coal_var_t, {
                        sepClass: "isd-dashboard-sep",
                        varClass: varianceClass(coalVar)
                    }) +

                    td(r.mtd_waste_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.mtd_waste_plan_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.mtd_waste_var_bcm, {
                        sepClass: "isd-dashboard-sep",
                        varClass: varianceClass(wasteVar)
                    }) +

                    td(r.day_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.day_target_bcm, { sepClass: "isd-dashboard-subsep" }) +
                    td(r.day_var_bcm, {
                        sepClass: "isd-dashboard-sep",
                        varClass: varianceClass(dayVar)
                    }) +
                '</tr>' +
            '</table>'
        );
    }

    function buildSiteCard(r, siteColourMap) {
        const site = String(r.site || "").trim();
        const start = formatDateForUser(r.prod_start);
        const end = formatDateForUser(r.prod_end);
        const forecastVar = Number(r.forecast_var || 0);
        const employeeLabel = "Employees: " + fmtInt(r.employee_count || 0);
        const headerBackground = getHeaderBackgroundStyle(site, siteColourMap);

        return (
            '<div class="isd-dashboard-card">' +
                '<div class="isd-dashboard-card-header" style="' + headerBackground + '">' +
                    '<div class="isd-dashboard-card-title">SITE: ' + escapeHtml(site) + '</div>' +
                    '<div class="isd-dashboard-card-subtitle">' +
                        'PRODUCTION PERIOD: ' + escapeHtml(start) + ' → ' + escapeHtml(end) +
                    '</div>' +

                    '<div class="isd-dashboard-kpi-row">' +
                        kpiBox("Month Target", r.month_target_bcm) +
                        kpiBox("Forecast", r.forecast_bcm) +
                        kpiBox("Var: Forecast vs.Month Target", forecastVar, {
                            coloured: true,
                            showArrow: true
                        }) +
                        kpiBox("Days Left in Month", r.days_left) +
                        kpiBox("Original Daily Target", r.original_daily_target) +
                        kpiBox("Current Avg per Day", r.current_avg_per_day) +
                        kpiRequiredVsOriginal(
                            "Required Daily for Target",
                            r.required_daily,
                            r.original_daily_target
                        ) +
                        kpiBox("Projected BCM/man", r.projected_bcm_per_man, {
                            sublabel: employeeLabel,
                            formatter: function (v) { return fmtDecimal(v, 1); },
                            customBackground: "#d9f0ff",
                            customTextColor: "#000000"
                        }) +
                    '</div>' +
                '</div>' +

                '<div class="isd-dashboard-table-wrap">' +
                    buildSummaryTable(r) +
                '</div>' +
            '</div>'
        );
    }

    function sortRows(rows, siteOrderMap) {
        return rows.slice().sort(function (a, b) {
            const aSite = String(a.site || "").trim();
            const bSite = String(b.site || "").trim();

            const aHasOrder = Object.prototype.hasOwnProperty.call(siteOrderMap, aSite);
            const bHasOrder = Object.prototype.hasOwnProperty.call(siteOrderMap, bSite);

            if (aHasOrder && bHasOrder) {
                return siteOrderMap[aSite] - siteOrderMap[bSite];
            }

            if (aHasOrder) {
                return -1;
            }

            if (bHasOrder) {
                return 1;
            }

            return aSite.localeCompare(bSite);
        });
    }

    function renderDashboard(response) {
        const rows = response && response.rows ? response.rows : [];
        const siteOrderMap = response && response.site_order_map ? response.site_order_map : {};
        const siteColourMap = response && response.site_colour_map ? response.site_colour_map : {};

        if (!rows.length) {
            dashEl.innerHTML = '<div class="text-muted">No data for the selected filter.</div>';
            return;
        }

        const sorted = sortRows(rows, siteOrderMap);

        dashEl.innerHTML = sorted.map(function (row) {
            return buildSiteCard(row, siteColourMap);
        }).join("");
    }



    function to_native_promise(value) {
        return new Promise(function (resolve, reject) {
            if (!value || typeof value.then !== "function") {
                resolve(value);
                return;
            }

            if (typeof value.done === "function" && typeof value.fail === "function") {
                value.done(resolve);
                value.fail(reject);
                return;
            }

            value.then(resolve, reject);
        });
    }

    function get_csrf_token() {
        const fromFrappe = window.frappe && window.frappe.csrf_token;
        const fromWindow = window.csrf_token;
        const fromMeta = document.querySelector('meta[name="csrf-token"]');
        const fromTemplate = "{{ csrf_token }}";

        const token = fromFrappe || fromWindow || (fromMeta ? fromMeta.content : "") || fromTemplate;

        if (!token || token.indexOf("{{") !== -1) {
            return "";
        }

        return token;
    }

    function normalise_frappe_response(data) {
        if (!data) {
            return {};
        }

        return data;
    }

    function call_method(method, args) {
        args = args || {};

        if (window.frappe && typeof window.frappe.call === "function") {
            return to_native_promise(window.frappe.call({
                method: method,
                args: args,
                freeze: false
            })).then(normalise_frappe_response);
        }

        const headers = {
            "Accept": "application/json",
            "Content-Type": "application/json"
        };

        const csrfToken = get_csrf_token();

        if (csrfToken) {
            headers["X-Frappe-CSRF-Token"] = csrfToken;
        }

        return fetch("/api/method/" + method, {
            method: "POST",
            credentials: "same-origin",
            headers: headers,
            body: JSON.stringify(args)
        })
            .then(function (response) {
                return response.text().then(function (text) {
                    let data = {};

                    if (text) {
                        try {
                            data = JSON.parse(text);
                        } catch (e) {
                            data = { message: text };
                        }
                    }

                    if (!response.ok) {
                        const err = new Error(
                            data.exc_type || data.exception || data.exc || response.statusText || "Request failed"
                        );
                        err.status = response.status;
                        err.response = data;
                        throw err;
                    }

                    return normalise_frappe_response(data);
                });
            });
    }

    function clear_existing_timer() {
        if (_timer) {
            clearInterval(_timer);
            _timer = null;
        }
    }

    function start_auto_refresh() {
        stop_auto_refresh();

        _timer = setInterval(function () {
            if (String(input.value || "").trim()) {
                safe_refresh(true);
            }
        }, REFRESH_INTERVAL_MS);
    }

    function stop_auto_refresh() {
        clear_existing_timer();
        _refreshing = false;
    }

    function format_last_successful_refresh() {
        if (!_last_successful_refresh) {
            return "never";
        }

        return _last_successful_refresh.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function safe_refresh(is_auto) {
        if (_refreshing) {
            return Promise.resolve();
        }

        if (!String(input.value || "").trim()) {
            return Promise.resolve();
        }

        _refreshing = true;

        return to_native_promise(load_and_render(is_auto))
            .then(function () {
                _last_successful_refresh = new Date();
                _refreshing = false;
            }, function (e) {
                console.error("Dashboard refresh failed:", e);
                statusEl.textContent = "Refresh failed. Last successful update: " + format_last_successful_refresh();
                _refreshing = false;
            });
    }

    function refresh_when_visible_again() {
        if (!document.hidden && String(input.value || "").trim()) {
            safe_refresh(true);
        }
    }

    function hard_reload_page() {
        window.location.reload();
    }

    function run_report(value) {
        return call_method("is_production.templates.pages.portal_site_volume_tracking.run_portal_report", {
            define_monthly_production: value
        });
    }

    function load_and_render(is_auto) {
        const val = String(input.value || "").trim();

        if (!val) {
            localStorage.removeItem(STORAGE_KEY);
            stop_auto_refresh();
            statusEl.textContent = "Select a Define Monthly Production to load the dashboard.";
            dashEl.innerHTML = "";
            return Promise.resolve();
        }

        localStorage.setItem(STORAGE_KEY, val);
        statusEl.textContent = is_auto ? "Refreshing..." : "Loading...";

        return run_report(val)
            .then(function (r) {
                renderDashboard(r.message || {});

                const time = new Date().toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                statusEl.textContent = "Last updated: " + time + " (refreshes every 10 minutes)";
            })
            .catch(function (e) {
                console.error("Site Volume Tracking portal error:", e);
                statusEl.textContent = "Error loading dashboard data.";
                dashEl.innerHTML = '<div class="text-danger">Could not load data. Check console / server logs.</div>';
                throw e;
            });
    }

    async function search_define_monthly_production(term) {
        const r = await call_method("is_production.templates.pages.portal_site_volume_tracking.search_define_monthly_production", {
            txt: term || ""
        });

        return r.message || [];
    }

    async function render_dropdown() {
        const term = input.value || "";

        try {
            const results = await search_define_monthly_production(term);

            if (!results.length) {
                dropdown.innerHTML = '<div class="portal-empty">No matches found</div>';
                dropdown.style.display = "block";
                return;
            }

            dropdown.innerHTML = results.map(function (option) {
                return (
                    '<div class="portal-option" data-value="' + escapeHtml(option) + '">' +
                        escapeHtml(option) +
                    '</div>'
                );
            }).join("");

            dropdown.style.display = "block";
        } catch (e) {
            console.error("Search failed:", e);
            dropdown.innerHTML = '<div class="portal-empty">No matches found</div>';
            dropdown.style.display = "block";
        }
    }

    input.addEventListener("focus", render_dropdown);
    input.addEventListener("input", render_dropdown);

    dropdown.addEventListener("mousedown", function (e) {
        const optionEl = e.target.closest(".portal-option");

        if (!optionEl) {
            return;
        }

        input.value = optionEl.getAttribute("data-value");
        dropdown.style.display = "none";

        safe_refresh(false);
        start_auto_refresh();
    });

    input.addEventListener("change", function () {
        if (!String(input.value || "").trim()) {
            safe_refresh(false);
        }
    });

    document.addEventListener("click", function (e) {
        const wrap = input.closest(".portal-filter");

        if (wrap && !wrap.contains(e.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("visibilitychange", refresh_when_visible_again);
    window.addEventListener("focus", refresh_when_visible_again);
    window.addEventListener("online", refresh_when_visible_again);

    window.setTimeout(hard_reload_page, HARD_RELOAD_INTERVAL_MS);

    const last = localStorage.getItem(STORAGE_KEY);

    if (last) {
        input.value = last;

        setTimeout(function () {
            if (input.value) {
                safe_refresh(false);
                start_auto_refresh();
            }
        }, 0);
    } else {
        statusEl.textContent = "Select a Define Monthly Production to load the dashboard.";
    }

    window.addEventListener("beforeunload", function () {
        stop_auto_refresh();
    });
})();
</script>
{% endblock %}

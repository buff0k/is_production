{% extends "templates/web.html" %}

{% block page_content %}
<link rel="stylesheet" href="/assets/is_production/css/dashboards.css">
<style>
html,
body {
    background: #ffffff !important;
    overflow: hidden !important;
}

header,
footer,
.web-footer,
.navbar,
.page-breadcrumbs,
.page-header,
.page-footer,
.footer-powered {
    display: none !important;
}

.web-page,
.page_content,
.page-content,
.page-content-wrapper,
main,
.container,
.container-fluid {
    max-width: none !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
}

#portal-hourly-dashboard-app {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #ffffff;
    overflow: auto;
    padding: 18px;
    box-sizing: border-box;
}

.portal-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    padding: 0;
}

.portal-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    line-height: 32px;
    color: var(--isd-dashboard-text, #1f272e);
    white-space: nowrap;
}

.portal-filter {
    width: 320px;
    position: relative;
}

.portal-filter input {
    width: 100%;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--isd-dashboard-border, #d1d8dd);
    padding: 4px 10px;
    background: var(--isd-dashboard-muted-bg, #f7fafc);
    color: var(--isd-dashboard-text, #1f272e);
    font-size: 14px;
    outline: none;
}

.portal-filter input:focus {
    border-color: #9aa8b5;
    background: #ffffff;
}

.portal-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 10000;
    background: #ffffff;
    border: 1px solid var(--isd-dashboard-border, #d1d8dd);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    max-height: 260px;
    overflow-y: auto;
    display: none;
}

.portal-option {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #f3f3f3;
    font-size: 13px;
}

.portal-option:hover {
    background: var(--isd-dashboard-muted-bg, #f7fafc);
}

.portal-empty {
    padding: 10px 12px;
    color: var(--isd-dashboard-muted-text, #6b7280);
    font-size: 13px;
}

#dashboard_status {
    margin: 0 0 10px 0;
    padding: 0;
    color: var(--isd-dashboard-muted-text, #6b7280);
    font-size: 14px;
}

#dashboard_content {
    width: 100%;
}

.text-muted {
    color: var(--isd-dashboard-muted-text, #6b7280);
}

.text-danger {
    color: var(--isd-dashboard-red, #e24c4c);
}

@media (max-width: 900px) {
    #portal-hourly-dashboard-app {
        padding: 8px;
    }

    .portal-topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
    }

    .portal-filter {
        width: 100%;
    }
}
</style>

<div id="portal-hourly-dashboard-app">
    <div class="portal-topbar">
        <h1 class="portal-title">Hourly Dashboard</h1>

        <div class="portal-filter">
            <input
                type="text"
                id="define_monthly_production"
                placeholder="Search Define Monthly Production"
                autocomplete="off"
            >
            <div id="define_monthly_production_dropdown" class="portal-dropdown"></div>
        </div>
    </div>

    <div id="dashboard_status">Select a Define Monthly Production to load the dashboard.</div>
    <div id="dashboard_content" class="isd-dashboard isd-dashboard--hourly">
        <div id="dashboard_grid" class="isd-dashboard-grid"></div>
    </div>
</div>

<script>
(function () {
    const REFRESH_INTERVAL_MS = 10 * 60 * 1000;
    const HARD_RELOAD_INTERVAL_MS = 4 * 60 * 60 * 1000;
    const STORAGE_KEY = "portal_hourly_dash_define_monthly_production";

    const SLOT_LABELS = [
        "06-07", "07-08", "08-09", "09-10", "10-11", "11-12", "12-13",
        "13-14", "14-15", "15-16", "16-17", "17-18",
        "18-19", "19-20", "20-21", "21-22", "22-23", "23-24",
        "24-01", "01-02", "03-04", "04-05", "05-06"
    ];

    /*
        Keep the exact desk-page slot labels.
        The assignment below protects against accidental edits above.
    */
    SLOT_LABELS.splice(
        0,
        SLOT_LABELS.length,
        "06-07", "07-08", "08-09", "09-10", "10-11", "11-12", "12-13",
        "13-14", "14-15", "15-16", "16-17", "17-18",
        "18-19", "19-20", "20-21", "21-22", "22-23", "23-24",
        "24-01", "01-02", "02-03", "03-04", "04-05", "05-06"
    );

    const input = document.getElementById("define_monthly_production");
    const dropdown = document.getElementById("define_monthly_production_dropdown");
    const statusEl = document.getElementById("dashboard_status");
    const dashEl = document.getElementById("dashboard_grid");

    let _refreshing = false;
    let _timer = null;
    let _last_successful_refresh = null;

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function slotField(slotNumber) {
        return "slot_" + String(slotNumber).padStart(2, "0");
    }

    function normaliseInt(value) {
        const parsed = parseInt(value, 10);
        return Number.isFinite(parsed) ? parsed : 0;
    }

    function hasOwn(obj, key) {
        return Object.prototype.hasOwnProperty.call(obj, key);
    }

    function getCellDisplay(value) {
        value = normaliseInt(value);

        if (value === 0) {
            return {
                css_class: "",
                display: "",
                title: ""
            };
        }

        if (value >= 1 && value <= 199) {
            return {
                css_class: "isd-dashboard-cell-low",
                display: String(value),
                title: value + " bcm"
            };
        }

        if (value >= 200 && value <= 219) {
            return {
                css_class: "isd-dashboard-cell-medium",
                display: String(value),
                title: value + " bcm"
            };
        }

        return {
            css_class: "isd-dashboard-cell-high",
            display: String(value),
            title: value + " bcm"
        };
    }

    function extractRowsFromPayload(payload) {
        if (!payload) {
            return [];
        }

        if (Array.isArray(payload.result)) {
            return payload.result;
        }

        if (Array.isArray(payload.data)) {
            return payload.data;
        }

        if (Array.isArray(payload)) {
            return payload;
        }

        return [];
    }

    function groupRowsBySite(rows, siteOrderMap) {
        const siteMap = new Map();

        rows.forEach(function (row) {
            const site = String(row.site || "").trim();

            if (!site) {
                return;
            }

            if (!siteMap.has(site)) {
                const hasMappedOrder = siteOrderMap && hasOwn(siteOrderMap, site);

                siteMap.set(site, {
                    site: site,
                    site_order: hasMappedOrder
                        ? normaliseInt(siteOrderMap[site])
                        : normaliseInt(row.site_order),
                    production_day: row.production_day || "",
                    rows: []
                });
            }

            const group = siteMap.get(site);

            if (!group.production_day && row.production_day) {
                group.production_day = row.production_day;
            }

            if (!row.is_empty_site) {
                group.rows.push(row);
            }
        });

        return Array.from(siteMap.values()).sort(function (a, b) {
            if (a.site_order !== b.site_order) {
                return a.site_order - b.site_order;
            }

            return a.site.localeCompare(b.site);
        });
    }

    function getHeaderBackgroundStyle(site, siteColourMap) {
        const mappedColour = siteColourMap && siteColourMap[site]
            ? String(siteColourMap[site]).trim()
            : "";

        if (!mappedColour) {
            return "background:transparent;";
        }

        return "background:" + escapeHtml(mappedColour) + ";";
    }

    function renderHourHeader() {
        const hourHeaders = SLOT_LABELS.map(function (label) {
            const escapedLabel = escapeHtml(label);
            const displayLabel = escapedLabel.replace("-", "<br>");

            return (
                '<th class="isd-dashboard-th" title="' + escapedLabel + '">' +
                    displayLabel +
                '</th>'
            );
        }).join("");

        return (
            "<tr>" +
                '<th class="isd-dashboard-th">Excavator</th>' +
                hourHeaders +
            "</tr>"
        );
    }

    function renderExcavatorRow(row) {
        const excavator = escapeHtml(row.excavator || "");

        const cells = [
            '<td class="isd-dashboard-td isd-dashboard-excavator" title="' + excavator + '">' +
                excavator +
            "</td>"
        ];

        for (let slot = 1; slot <= 24; slot++) {
            const value = normaliseInt(row[slotField(slot)]);
            const cell = getCellDisplay(value);
            const titleAttr = cell.title ? ' title="' + escapeHtml(cell.title) + '"' : "";
            const cssClass = cell.css_class ? " " + cell.css_class : "";

            cells.push(
                '<td class="isd-dashboard-td' + cssClass + '"' + titleAttr + ">" +
                    escapeHtml(cell.display) +
                "</td>"
            );
        }

        return "<tr>" + cells.join("") + "</tr>";
    }

    function renderSiteBlock(group, siteColourMap) {
        const rowsHtml = group.rows.map(renderExcavatorRow).join("");
        const headerBackground = getHeaderBackgroundStyle(group.site, siteColourMap);

        return (
            '<div class="isd-dashboard-card">' +
                '<div class="isd-dashboard-card-header" style="' + headerBackground + '">' +
                    '<div class="isd-dashboard-card-title">Site: ' + escapeHtml(group.site) + "</div>" +
                    '<div class="isd-dashboard-card-subtitle">' +
                        "Production Day: " + escapeHtml(group.production_day) +
                    "</div>" +
                "</div>" +

                '<div class="isd-dashboard-table-wrap">' +
                    '<table class="isd-dashboard-table isd-dashboard-table--hourly">' +
                        renderHourHeader() +
                        rowsHtml +
                    "</table>" +
                "</div>" +
            "</div>"
        );
    }

    function renderDashboard(response) {
        const payload = response && response.payload ? response.payload : {};
        const siteOrderMap = response && response.site_order_map ? response.site_order_map : {};
        const siteColourMap = response && response.site_colour_map ? response.site_colour_map : {};
        const rows = extractRowsFromPayload(payload);

        if (!rows.length) {
            dashEl.innerHTML = '<div class="text-muted">No data for the selected filter.</div>';
            return;
        }

        const groupedSites = groupRowsBySite(rows, siteOrderMap);

        if (!groupedSites.length) {
            dashEl.innerHTML = '<div class="text-muted">No sites found for the selected filter.</div>';
            return;
        }

        dashEl.innerHTML = groupedSites.map(function (group) {
            return renderSiteBlock(group, siteColourMap);
        }).join("");
    }



    function to_native_promise(value) {
        return new Promise(function (resolve, reject) {
            if (!value || typeof value.then !== "function") {
                resolve(value);
                return;
            }

            if (typeof value.done === "function" && typeof value.fail === "function") {
                value.done(resolve);
                value.fail(reject);
                return;
            }

            value.then(resolve, reject);
        });
    }

    function get_csrf_token() {
        const fromFrappe = window.frappe && window.frappe.csrf_token;
        const fromWindow = window.csrf_token;
        const fromMeta = document.querySelector('meta[name="csrf-token"]');
        const fromTemplate = "{{ csrf_token }}";

        const token = fromFrappe || fromWindow || (fromMeta ? fromMeta.content : "") || fromTemplate;

        if (!token || token.indexOf("{{") !== -1) {
            return "";
        }

        return token;
    }

    function normalise_frappe_response(data) {
        if (!data) {
            return {};
        }

        return data;
    }

    function call_method(method, args) {
        args = args || {};

        if (window.frappe && typeof window.frappe.call === "function") {
            return to_native_promise(window.frappe.call({
                method: method,
                args: args,
                freeze: false
            })).then(normalise_frappe_response);
        }

        const headers = {
            "Accept": "application/json",
            "Content-Type": "application/json"
        };

        const csrfToken = get_csrf_token();

        if (csrfToken) {
            headers["X-Frappe-CSRF-Token"] = csrfToken;
        }

        return fetch("/api/method/" + method, {
            method: "POST",
            credentials: "same-origin",
            headers: headers,
            body: JSON.stringify(args)
        })
            .then(function (response) {
                return response.text().then(function (text) {
                    let data = {};

                    if (text) {
                        try {
                            data = JSON.parse(text);
                        } catch (e) {
                            data = { message: text };
                        }
                    }

                    if (!response.ok) {
                        const err = new Error(
                            data.exc_type || data.exception || data.exc || response.statusText || "Request failed"
                        );
                        err.status = response.status;
                        err.response = data;
                        throw err;
                    }

                    return normalise_frappe_response(data);
                });
            });
    }

    function clear_existing_timer() {
        if (_timer) {
            clearInterval(_timer);
            _timer = null;
        }
    }

    function start_auto_refresh() {
        stop_auto_refresh();

        _timer = setInterval(function () {
            if (String(input.value || "").trim()) {
                safe_refresh(true);
            }
        }, REFRESH_INTERVAL_MS);
    }

    function stop_auto_refresh() {
        clear_existing_timer();
        _refreshing = false;
    }

    function format_last_successful_refresh() {
        if (!_last_successful_refresh) {
            return "never";
        }

        return _last_successful_refresh.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function safe_refresh(is_auto) {
        if (_refreshing) {
            return Promise.resolve();
        }

        if (!String(input.value || "").trim()) {
            return Promise.resolve();
        }

        _refreshing = true;

        return to_native_promise(load_and_render(is_auto))
            .then(function () {
                _last_successful_refresh = new Date();
                _refreshing = false;
            }, function (e) {
                console.error("Dashboard refresh failed:", e);
                statusEl.textContent = "Refresh failed. Last successful update: " + format_last_successful_refresh();
                _refreshing = false;
            });
    }

    function refresh_when_visible_again() {
        if (!document.hidden && String(input.value || "").trim()) {
            safe_refresh(true);
        }
    }

    function hard_reload_page() {
        window.location.reload();
    }

    function run_report(value) {
        return call_method("is_production.templates.pages.portal_hourly_dashboard.run_portal_report", {
            define_monthly_production: value
        });
    }

    function load_and_render(is_auto) {
        const val = input.value;

        if (!val) {
            statusEl.textContent = "Select a Define Monthly Production to load the dashboard.";
            dashEl.innerHTML = "";
            return Promise.resolve();
        }

        localStorage.setItem(STORAGE_KEY, val);
        statusEl.textContent = is_auto ? "Refreshing..." : "Loading...";

        return run_report(val)
            .then(function (r) {
                renderDashboard(r.message || {});

                const time = new Date().toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                statusEl.textContent = "Last updated: " + time + " (refreshes every 10 minutes)";
            })
            .catch(function (e) {
                console.error("Hourly Dashboard portal error:", e);
                statusEl.textContent = "Error loading dashboard data.";
                dashEl.innerHTML = '<div class="text-danger">Could not load data. Check console / server logs.</div>';
                throw e;
            });
    }

    async function search_define_monthly_production(term) {
        const r = await call_method("is_production.templates.pages.portal_hourly_dashboard.search_define_monthly_production", {
            txt: term || ""
        });

        return r.message || [];
    }

    async function render_dropdown() {
        const term = input.value || "";

        try {
            const results = await search_define_monthly_production(term);

            if (!results.length) {
                dropdown.innerHTML = '<div class="portal-empty">No matches found</div>';
                dropdown.style.display = "block";
                return;
            }

            dropdown.innerHTML = results.map(function (option) {
                return (
                    '<div class="portal-option" data-value="' + escapeHtml(option) + '">' +
                        escapeHtml(option) +
                    '</div>'
                );
            }).join("");

            dropdown.style.display = "block";
        } catch (e) {
            console.error("Search failed:", e);
            dropdown.innerHTML = '<div class="portal-empty">No matches found</div>';
            dropdown.style.display = "block";
        }
    }

    input.addEventListener("focus", render_dropdown);
    input.addEventListener("input", render_dropdown);

    dropdown.addEventListener("mousedown", function (e) {
        const optionEl = e.target.closest(".portal-option");

        if (!optionEl) {
            return;
        }

        input.value = optionEl.getAttribute("data-value");
        dropdown.style.display = "none";

        safe_refresh(false);
        start_auto_refresh();
    });

    document.addEventListener("click", function (e) {
        const wrap = input.closest(".portal-filter");

        if (wrap && !wrap.contains(e.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("visibilitychange", refresh_when_visible_again);
    window.addEventListener("focus", refresh_when_visible_again);
    window.addEventListener("online", refresh_when_visible_again);

    window.setTimeout(hard_reload_page, HARD_RELOAD_INTERVAL_MS);

    const last = localStorage.getItem(STORAGE_KEY);

    if (last) {
        input.value = last;
        safe_refresh(false);
        start_auto_refresh();
    } else {
        statusEl.textContent = "Select a Define Monthly Production to load the dashboard.";
    }

    window.addEventListener("beforeunload", function () {
        stop_auto_refresh();
    });
})();
</script>
{% endblock %}
